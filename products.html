
<!DOCTYPE html>
<html>
<head>
    <title>Our Products</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <header>
        <h1>Our Products</h1>
        <p>Browse our latest products below.</p>
    </header>

    <main class="product-container">

        <div class="product-card">
            <img src="https://placehold.co/270x180?text=Smartphone" alt="Smartphone">
            <h2>Smartphone</h2>
            <p>R3,500</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/270x180?text=Laptop" alt="Laptop">
            <h2>Laptop</h2>
            <p>R8,500</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/270x180?text=Headphones" alt="Headphones">
            <h2>Headphones</h2>
            <p>R750</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/270x180?text=Smartwatch" alt="Smartwatch">
            <h2>Smartwatch</h2>
            <p>R1,200</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/270x180?text=Tablet" alt="Tablet">
            <h2>Tablet</h2>
            <p>R4,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/270x180?text=Camera" alt="Camera">
            <h2>Digital Camera</h2>
            <p>R5,500</p>
            <button>Add to Cart</button>
        </div>

    </main>

</body>
</html>
